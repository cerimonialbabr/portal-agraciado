      const format=String(t.FORMATO||'REDONDA').toUpperCase(),shape=document.createElement('div'),w=U.num(t.W,format==='RETANGULAR'?18:10),ratio=(floor.clientWidth||1600)/(floor.clientHeight||900),h=format==='REDONDA'?w*ratio:U.num(t.H,format==='RETANGULAR'?8:10);
      shape.className='overview-table-shape '+(format==='REDONDA'?'round':format==='U'?'u':'rect')+' clickable';
      shape.style.left=U.num(t.X,50)+'%';shape.style.top=U.num(t.Y,50)+'%';shape.style.width=w+'%';shape.style.height=h+'%';shape.style.transform=`translate(-50%,-50%) rotate(${U.num(t.ROTACAO,0)}deg)`;
      const at=activeGuests.filter(g=>String(g.MESA_ID)===String(t.ID_MESA)).sort(U.byPrecedence),unseated=at.filter(g=>!g.ASSENTO).length;
      const orient=tableOrientationInfo(t,at),rot=U.num(t.ROTACAO,0),orientIcon=orient.isPrincipal?'★':orient.dir,orientMajor=orient.major?[orient.major.POSTO_GRAD,orient.major.NOME_GUERRA||orient.major.NOME_COMPLETO].filter(Boolean).join(' '):'';
      shape.innerHTML=`<span class="overview-table-name">${U.esc(t.NOME)}<span class="overview-table-meta">${at.length}/${U.num(t.CAPACIDADE)}${unseated?` • ${unseated} sem lugar`:''}</span></span>`;
      shape.title=`${t.NOME} — ${at.length}/${U.num(t.CAPACIDADE)} pessoas.${orient.text?' '+orient.text+'.':''} Passe o mouse ou clique para ver a disposição completa.`;
      let hoverTimer=null;
      shape.addEventListener('mouseenter',()=>{if(hoverTimer)clearTimeout(hoverTimer);hoverTimer=setTimeout(()=>{if(!overviewPopoverPinned)showCerimonialOverviewPopover(t,shape,false);},130);});
      shape.addEventListener('mouseleave',()=>{if(hoverTimer){clearTimeout(hoverTimer);hoverTimer=null;}scheduleCloseCerimonialOverviewPopover();});
      shape.addEventListener('click',ev=>{ev.stopPropagation();showCerimonialOverviewPopover(t,shape,true);});
      floor.appendChild(shape);

      const major=at.find(g=>U.normalize(g.NIVEL)==='autoridade')||at[0]||null,total=Math.max(1,U.num(t.CAPACIDADE),at.length),cards=[];
      at.filter(g=>g.ASSENTO).forEach(g=>{
        const code=String(g.ASSENTO),orientation=U.seatOrientation(t,code,total),el=document.createElement('div');
        const host=String(g.ID_CONVIDADO)===String(t.ANFITRIAO_ID||e.ANFITRIAO_ID||''),rank1=major&&String(g.ID_CONVIDADO)===String(major.ID_CONVIDADO);
        const label=[g.POSTO_GRAD,g.NOME_GUERRA||g.NOME_COMPLETO].filter(Boolean).join(' ');
        el.className='overview-inline-seat '+orientation+(host?' host':'')+(rank1?' rank1':'');
        el.dataset.orientation=orientation;el.dataset.label=label;el.dataset.code=code;el.dataset.total=String(total);el.dataset.priority=host?'0':rank1?'1':'2';el.dataset.tableRot=String(U.num(t.ROTACAO,0));el.title=label;
        el.innerHTML=`<span class="overview-inline-seat-text">${U.esc(label)}</span>`;
        floor.appendChild(el);cards.push(el);
      });
      groups.push({table:t,shape,cards,w,format,priority:(U.yes(t.PRINCIPAL)?0:1)});
    });

    const rectsOverlap=(a,b,gap)=>!(a.right+gap<=b.left||b.right+gap<=a.left||a.bottom+gap<=b.top||b.bottom+gap<=a.top);
    const expandedRect=(r,pad)=>({left:r.left-pad,top:r.top-pad,right:r.right+pad,bottom:r.bottom+pad});
    let lastScale=-1;

    const measureCanvas=document.createElement('canvas'),measureCtx=measureCanvas.getContext('2d');
    function measuredLabelWidth(el,scale){
      const label=String(el.dataset.label||'');
      const px=Math.max(8.1,Math.min(10,8.1+(scale-1)*.7));
      if(measureCtx){measureCtx.font=`800 ${px}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;return Math.ceil(measureCtx.measureText(label).width+14);}
      return Math.ceil(label.length*px*.62+14);
    }

    function styleCardForWidth(el,labelLength,scale){
      const inv=1/Math.max(.001,scale),vertical=el.dataset.orientation==='vertical',rot=U.num(el.dataset.tableRot,0);
      if(vertical)labelLength=Math.max(labelLength,measuredLabelWidth(el,scale));
      el.style.setProperty('--overview-seat-label-length',labelLength+'px');
      if(vertical){
        el.style.width=Math.max(20,Math.min(25,20+(scale-1)*1.6))+'px';
        el.style.height=labelLength+'px';
      }else{
        el.style.width=labelLength+'px';
        el.style.height=Math.max(19,Math.min(23,19+(scale-1)*1.25))+'px';
      }
      el.style.fontSize=Math.max(8.1,Math.min(10,8.1+(scale-1)*.7))+'px';
      el.style.transform=`translate(-50%,-50%) rotate(${rot}deg) scale(${inv})`;
    }

    function positionCard(el,group,scale){
      const cardW=parseFloat(el.style.width)||58,cardH=parseFloat(el.style.height)||21;
      const p=overviewSeatPosition(group.table,el.dataset.code,U.num(el.dataset.total,1),{floorW:floor.clientWidth||1600,floorH:floor.clientHeight||900,scale,cardW,cardH,gap:3});
      el.style.left=p.x+'%';el.style.top=p.y+'%';
    }

    function candidateRects(group,width,scale){
      group.cards.forEach(el=>{styleCardForWidth(el,width,scale);positionCard(el,group,scale);});
      return group.cards.map(el=>expandedRect(el.getBoundingClientRect(),1.5));
    }

    function updateRoundShapes(){
      const ratio=(floor.clientWidth||1600)/(floor.clientHeight||900);
      groups.forEach(g=>{if(g.format==='REDONDA')g.shape.style.height=(g.w*ratio)+'%';});
    }

    function updateInlineCompositions(scale,force){
      if(!force&&Math.abs(scale-lastScale)<.015)return;
      lastScale=scale;updateRoundShapes();
      // Regra única para REDONDA, RETANGULAR e U: mostrar o máximo possível sem sobreposição.
      // O nome cresce progressivamente com o zoom; no mínimo, usa ellipsis em cartão curto.
      const target=Math.max(88,Math.min(190,112+(scale-1)*58));
      const minWidth=42;
      const widths=[];
      for(let w=target;w>=minWidth;w-=8)widths.push(Math.round(w));
      if(widths[widths.length-1]!==minWidth)widths.push(minWidth);
      groups.forEach(g=>g.cards.forEach(el=>{el.classList.remove('visible');el.style.visibility='hidden';el.style.opacity='0';}));
      const accepted=[];
      const ordered=groups.slice().sort((a,b)=>a.priority-b.priority||U.num(a.table.Y)-U.num(b.table.Y)||U.num(a.table.X)-U.num(b.table.X));

      ordered.forEach(group=>{
        if(!group.cards.length)return;
        // Regra geral para qualquer formato: cada cartão tenta ocupar o maior espaço
        // disponível sem tocar em outro cartão. Isso permite que U e RETANGULAR usem
        // nomes muito mais completos quando existe espaço, em vez de herdar a menor
        // largura necessária por outro lugar da mesma mesa.
        const localAccepted=[];
        const cards=group.cards.slice().sort((a,b)=>U.num(a.dataset.priority,2)-U.num(b.dataset.priority,2));
        cards.forEach(el=>{
          let fitted=null,rect=null;
          const attempts=el.dataset.orientation==='vertical'?[Math.max(88,measuredLabelWidth(el,scale))]:widths;
          for(const width of attempts){
            styleCardForWidth(el,width,scale);positionCard(el,group,scale);
            const r=expandedRect(el.getBoundingClientRect(),1.5);
            const bad=accepted.some(ar=>rectsOverlap(r,ar,0))||localAccepted.some(ar=>rectsOverlap(r,ar,0));
            if(!bad){fitted=width;rect=r;break;}
          }
          if(fitted!==null){
            styleCardForWidth(el,fitted,scale);positionCard(el,group,scale);
            el.style.visibility='visible';el.style.opacity='1';el.classList.add('visible');
            accepted.push(rect);localAccepted.push(rect);
          }
        });
      });
    }

    wrap.addEventListener('click',ev=>{if(!ev.target.closest('.overview-table-shape'))closeCerimonialOverviewPopover(true);});
    const ctl=U.enablePanZoom(wrap,floor,{onChange:({scale})=>{
      if(overviewPopoverEl&&!overviewPopoverPinned)closeCerimonialOverviewPopover(true);
      requestAnimationFrame(()=>updateInlineCompositions(scale,false));
    }});
    requestAnimationFrame(()=>updateInlineCompositions(ctl.getScale(),true));
    if(typeof ResizeObserver!=='undefined'){
      const ro=new ResizeObserver(()=>requestAnimationFrame(()=>updateInlineCompositions(ctl.getScale(),true)));
      ro.observe(wrap);
    }
    root.querySelector('[data-ov-in]').onclick=()=>{closeCerimonialOverviewPopover(true);ctl.zoomIn();};
    root.querySelector('[data-ov-out]').onclick=()=>{closeCerimonialOverviewPopover(true);ctl.zoomOut();};
    root.querySelector('[data-ov-reset]').onclick=()=>{closeCerimonialOverviewPopover(true);ctl.reset();};
  }

  function printCerimonialLayouts(){
    const tables=plannedCerimonialTables();
    if(!tables.length){U.toast('Não há mesas planejadas para imprimir.','error');return;}
    const eventName=(state.data.event&&state.data.event.NOME)||'Evento';
    const css=Array.from(document.querySelectorAll('style')).map(s=>s.textContent).join('\n');
    const pages=tables.map(table=>{
      const guests=(state.data.guests||[]).filter(g=>String(g.MESA_ID)===String(table.ID_MESA)&&U.normalize(g.RSVP)!=='nao comparecera').sort(U.byPrecedence);
      const holder=document.createElement('div');U.renderSeating(holder,table,guests);
      const canvas=holder.querySelector('.seating-canvas'),orient=tableOrientationInfo(table,guests),orientLine=orient.text?`<div class="print-orientation">${U.esc(orient.isPrincipal?'★':'')} ${U.esc(orient.isPrincipal?'':orient.dir)} ${U.esc(orient.text)}</div>`:'';
      return `<section class="print-page"><div class="print-head"><h1>${U.esc(eventName)}</h1><h2>${U.esc(table.NOME||('Mesa '+table.NUMERO))}</h2><div>${guests.length}/${U.num(table.CAPACIDADE)} pessoas</div>${orientLine}</div><div class="print-stage"><div class="print-inner">${canvas.outerHTML}</div></div></section>`;
    }).join('');
    const w=window.open('','_blank');
    if(!w){U.toast('O navegador bloqueou a janela de impressão.','error');return;}
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${U.esc(eventName)} — Composição das mesas</title><style>${css}\n@page{size:A4 landscape;margin:10mm}body{background:#fff;color:#111827;margin:0;font-family:Arial,sans-serif}.print-page{break-after:page;page-break-after:always;height:185mm;overflow:hidden}.print-page:last-child{break-after:auto;page-break-after:auto}.print-head{text-align:center;margin:0 0 4mm}.print-head h1{font-size:15pt;margin:0 0 2mm}.print-head h2{font-size:13pt;margin:0 0 1mm}.print-head div{font-size:9pt;color:#64748b}.print-head .print-orientation{margin-top:2mm;font-size:10pt;font-weight:700;color:#173f74}.print-stage{height:156mm;width:100%;overflow:hidden;display:flex;align-items:flex-start;justify-content:center}.print-inner{position:relative}.seating-canvas{margin:0}.seat{box-shadow:none}.table-shape{print-color-adjust:exact;-webkit-print-color-adjust:exact}</style></head><body>${pages}<script>window.addEventListener('load',()=>{document.querySelectorAll('.print-stage').forEach(stage=>{const inner=stage.querySelector('.print-inner'),canvas=inner.querySelector('.seating-canvas');if(!canvas)return;const sw=stage.clientWidth,sh=stage.clientHeight,cw=parseFloat(canvas.style.width)||canvas.offsetWidth,ch=parseFloat(canvas.style.height)||canvas.offsetHeight,scale=Math.min(sw/cw,sh/ch,1);inner.style.width=(cw*scale)+'px';inner.style.height=(ch*scale)+'px';canvas.style.transform='scale('+scale+')';canvas.style.transformOrigin='top left';});setTimeout(()=>window.print(),250);});<\/script></body></html>`);
    w.document.close();
  }

    const items=data.items||[], selected=data.selected||[];

      <div class="card">

          }

        }).join('')}</div>`:'<p class="muted">A Nominata está vazia.</p>'}

  function nominataSelectModal(data,c){
    const cand=(data.candidates||[]).slice().sort(U.byPrecedence);
    const m=U.modal('Adicionar à Nominata',`
      <div class="field"><label>Buscar</label><input id="nomSearch" class="search-input" placeholder="Nome, posto, cargo ou OM"></div>
      <div id="nomCandidates" style="max-height:420px;overflow:auto;margin-top:12px"></div>`,
      `<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-save>Adicionar selecionados</button>`);
    const draw=()=>{
      const q=U.normalize(U.$('#nomSearch',m).value);
      const rows=cand.filter(g=>!q||U.normalize([g.POSTO_GRAD,g.NOME_COMPLETO,g.NOME_GUERRA,g.CARGO,g.OM_ORGAO].join(' ')).includes(q));
      U.$('#nomCandidates',m).innerHTML=rows.length?rows.map(g=>`<label class="nominata-item" style="grid-template-columns:auto 1fr;margin-bottom:7px;cursor:pointer"><input type="checkbox" data-nom-id="${U.esc(g.ID_CONVIDADO)}"><div><strong>${U.esc(nominataText(g))}</strong></div></label>`).join(''):'<p class="muted">Nenhum convidado disponível.</p>';
    };
    U.$('#nomSearch',m).oninput=draw;draw();
    m.querySelector('[data-save]').onclick=async ev=>{
      const ids=Array.from(m.querySelectorAll('[data-nom-id]:checked')).map(x=>x.dataset.nomId);

  function postoExtensoLocal(posto){
    const ab=String(posto||'').trim();
    if(!ab)return '';
    const key=U.normalize(ab);
    const found=(state.postos||[]).find(p=>U.normalize(p.POSTO_ABREVIADO||'')===key);
    return String(found&&found.POSTO_EXTENSO||ab).trim();
  }

  function nominataText(g){
    g=g||{};
    const cargo=String(g.CARGO||'').trim();
    // Usa o valor vindo da API e mantém um fallback local para a tabela POSTOS.
    const posto=String(g.POSTO_EXTENSO||postoExtensoLocal(g.POSTO_GRAD)||g.POSTO_GRAD||'').trim();
    const ident=[posto,g.NOME_COMPLETO].filter(Boolean).join(' ').trim();
    return (cargo?cargo+', '+ident:ident).toUpperCase().replace(/[.\s]+$/,'')+'.';
  }

    x=x||{};const currentType=x.TIPO||'ARQUIVO';
    const m=U.modal(x.ID_CONTEUDO?'Editar conteúdo':'Adicionar conteúdo',`<div class="form-grid">${field('Título','cTit',x.TITULO)}${selectField('Tipo','cTipo',['CARDAPIO','PROGRAMA','HOMENAGEM','INFORMACOES','ARQUIVO','QR_CHECKIN'],currentType)}<div class="field" style="grid-column:1/-1"><label>Enviar arquivo</label><iframe id="contentUploader" class="upload-frame" style="height:82px" title="Enviar arquivo" src="${U.esc(A.uploaderUrl(currentType==='QR_CHECKIN'?'qr':'conteudo',state.eventId))}"></iframe></div><div class="field" style="grid-column:1/-1"><label>URL</label><input id="cUrl" value="${U.esc(x.URL||'')}" placeholder="Preenchida automaticamente após o envio"></div>${field('Ordem','cOrd',x.ORDEM||0,'number')}${selectField('Visível','cVis',['SIM','NAO'],x.VISIVEL||'SIM')}</div>`,`<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-save>Salvar</button>`);
    const typeSel=U.$('#cTipo',m),frame=U.$('#contentUploader',m);typeSel.onchange=()=>{frame.src=A.uploaderUrl(typeSel.value==='QR_CHECKIN'?'qr':'conteudo',state.eventId);};
    m.querySelector('[data-save]').onclick=async e=>{const b=e.currentTarget;U.setBusy(b,true);try{await A.call('saveContent',{id:x.ID_CONTEUDO||'',eventId:state.eventId,titulo:U.$('#cTit',m).value.trim()||typeSel.value,tipo:typeSel.value,url:U.$('#cUrl',m).value.trim(),ordem:U.$('#cOrd',m).value,visivel:U.$('#cVis',m).value});m.remove();await loadEvent();renderConteudos();}catch(err){U.toast(err.message,'error');}finally{U.setBusy(b,false);}};
  }
  function sponsorModal(x){
    x=x||{};
    const existingLogo=String(x.LOGO_URL||'');
    const previewHtml=existingLogo
      ? `<img src="${U.esc(U.driveImage(existingLogo))}" alt="Logo atual" style="max-width:150px;max-height:72px;object-fit:contain"><span class="small" style="color:#047857;font-weight:800">Logo atual</span>`
      : `<span class="small muted">Selecione a imagem e clique em Enviar.</span>`;
    const m=U.modal(x.ID_PATROCINADOR?'Editar patrocinador':'Adicionar patrocinador',`
      <div class="form-grid">
        ${field('Nome','sNome',x.NOME)}
        <div class="field" style="grid-column:1/-1">
          <label>Logo do patrocinador</label>
          <iframe class="upload-frame" style="height:82px" title="Enviar logo" src="${U.esc(A.uploaderUrl('logo',state.eventId))}"></iframe>
          <input id="sLogo" type="hidden" value="${U.esc(existingLogo)}">
          <div id="sLogoPreview" style="margin-top:8px;display:flex;align-items:center;gap:12px;min-height:28px">${previewHtml}</div>
        </div>
        <div class="field" style="grid-column:1/-1"><label>Site (opcional)</label><input id="sSite" value="${U.esc(x.URL_SITE||'')}"></div>
        ${field('Ordem','sOrd',x.ORDEM||0,'number')}${selectField('Visível','sVis',['SIM','NAO'],x.VISIVEL||'SIM')}
      </div>`,`<button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-save-sponsor>Salvar</button>`);
    const saveBtn=m.querySelector('[data-save-sponsor]');
    if(!existingLogo)saveBtn.disabled=true;
    saveBtn.onclick=async e=>{
      const b=e.currentTarget;U.setBusy(b,true);
      try{
        const logo=U.$('#sLogo',m).value.trim();
        if(!logo)throw new Error('Envie a logo do patrocinador antes de salvar.');
        await A.call('saveSponsor',{id:x.ID_PATROCINADOR||'',eventId:state.eventId,nome:U.$('#sNome',m).value.trim(),logoUrl:logo,urlSite:U.$('#sSite',m).value.trim(),ordem:U.$('#sOrd',m).value,visivel:U.$('#sVis',m).value});
        m.remove();await loadEvent();renderConteudos();
      }catch(err){U.toast(err.message,'error');}finally{U.setBusy(b,false);}
    };
  }

  function renderAcessos(){
    const c=U.$('[data-section="acessos"]');if(requireEvent(c,'Acessos'))return;
    const base=location.href.replace(/[^\/]*([?#].*)?$/,'');
    const evt='?evento='+encodeURIComponent(state.eventId);
    const lookup=base+'convidado.html'+evt;
    const reserve=base+'convidado.html'+evt+'&modo=reserva';
    const urls=[
      ['Recepção',base+'recepcao.html'+evt,'Interface operacional para localizar pessoas, confirmar chegada, acessar Nominata e croqui.'],
      ['Portal do convidado',lookup,'Link para o convidado pesquisar o próprio nome, localizar a mesa e confirmar quem chegou no seu grupo.'],
      ['Reserva de mesas',reserve,'Link para reserva de mesas.'],
      ['Painel da TV',base+'tv.html'+evt,'Painel deste evento com croqui, ocupação e últimas chegadas.']
    ];
    c.innerHTML=heading('Acessos','Os links abaixo já estão vinculados ao evento em edição.')+`<div class="grid grid-2">${urls.map(([n,u,d])=>`<div class="card"><h3>${U.esc(n)}</h3><p class="muted">${U.esc(d)}</p><div class="field"><input readonly value="${U.esc(u)}"></div><div class="actions" style="margin-top:10px"><button class="btn" data-copy="${U.esc(u)}">Copiar link</button><a class="btn btn-primary" href="${U.esc(u)}" target="_blank">Abrir</a></div></div>`).join('')}</div>`;
    c.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);U.toast('Link copiado.','success');}catch(e){U.toast('Não foi possível copiar automaticamente.','error');}});
  }

  function allocationLabel(v){
    const k=U.normalize(v);
    if(k==='planejada'||k==='fixo')return'PLANEJADA';
    if(k==='reserva')return'RESERVA';
    if(k==='livre')return'LIVRE';
    if(k==='reservada')return'RESERVADA';
    if(k==='hibrido')return'HÍBRIDO';
    return String(v||'—');
  }
  function selectValueField(label,id,opts,value){
    return `<div class="field"><label>${U.esc(label)}</label><select id="${id}">${opts.map(o=>`<option value="${U.esc(o[0])}" ${U.normalize(o[0])===U.normalize(value)?'selected':''}>${U.esc(o[1])}</option>`).join('')}</select></div>`;
  }
  function field(label,id,value,type,required){return `<div class="field"><label>${U.esc(label)}</label><input id="${id}" type="${type||'text'}" value="${U.esc(value||'')}" ${required?'required':''}></div>`;}
  function selectField(label,id,opts,value){return `<div class="field"><label>${U.esc(label)}</label><select id="${id}">${opts.map(o=>`<option value="${U.esc(o)}" ${String(o)===String(value)?'selected':''}>${U.esc(o||'—')}</option>`).join('')}</select></div>`;}
  function guestById(id){return (state.data.guests||[]).find(x=>String(x.ID_CONVIDADO)===String(id));}
  function tableById(id){return (state.data.tables||[]).find(x=>String(x.ID_MESA)===String(id));}
  function tableFor(id){return tableById(id);}
  async function runBusy(fn,label){
    const s=U.$('#syncStatus');if(s){s.innerHTML='<span class="spinner"></span> '+(label||'Atualizando');}
    try{return await fn();}catch(err){console.error(err);U.toast(err.message||String(err),'error');}finally{if(s)s.textContent='Pronto';}
  }
})();

</script>
</body>
</html>
