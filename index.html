<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal do Agraciado</title>

<link rel="stylesheet" href="css/portal.css">

</head>

<body>

<div class="container">

    <!-- ===========================
         Banner
    ============================ -->

    <div class="banner">

        <img
            src="https://picsum.photos/1400/500"
            alt="Banner da Solenidade"
        >

    </div>


    <!-- ===========================
         Card Principal
    ============================ -->

    <div class="card">

        <h1>

            Medalha Mérito Santos-Dumont

        </h1>

        <p>

            14 de julho de 2026

        </p>

        <p>

            Pátio de Solenidades da Base Aérea de Brasília

        </p>


        <a
            class="botao"
            href="#"
        >

            <div class="titulo">

                REGISTRAR PRESENÇA

            </div>

            <div class="subtitulo">

                Confira sua posição no dispositivo

            </div>

        </a>


        <a
            class="botao"
            href="#"
        >

            <div class="titulo">

                Programa Oficial

            </div>

            <div class="subtitulo">

                Consulte as informações da solenidade

            </div>

        </a>

    </div>


    <!-- ===========================
         Patrocinadores
    ============================ -->

    <div class="patrocinadores">

        <h2>

            APOIO

        </h2>

        <div class="logos">

            <img src="https://dummyimage.com/220x70/ffffff/888888&text=LOGO+1">

            <img src="https://dummyimage.com/220x70/ffffff/888888&text=LOGO+2">

            <img src="https://dummyimage.com/220x70/ffffff/888888&text=LOGO+3">

        </div>

    </div>

</div>
    
<script src="js/api.js"></script>
<script src="js/portal.js"></script>

</body>

</html>
