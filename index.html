<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Portal do Agraciado</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

<div class="container">

<div class="pagina">

<header class="topo">

<h1 id="titulo">

Carregando...

</h1>

<p id="subtitulo">

</p>

</header>

<div id="imagemPrincipal">

</div>

<div id="mensagemGeral">

</div>

<div
    style="
    margin-top:30px;
    display:flex;
    flex-direction:column;
    gap:12px;
    ">

<a
href="presenca.html"
class="botao-principal"
style="
text-decoration:none;
text-align:center;
">

REGISTRAR PRESENÇA

</a>

<a
href="#"
id="botaoLivreto"
class="botao-secundario">

LIVRETO DIGITAL

</a>

</div>

</div>

</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>

<script>

window.addEventListener(

"load",

iniciar

);

async function iniciar(){

    try{

        const dados =

            await apiGet(

                "dados"

            );

        carregarConfiguracoes(

            dados.config

        );

    }

    catch(e){

        console.error(e);

    }

}

function carregarConfiguracoes(config){

    document.getElementById(

        "titulo"

    ).textContent =

    config.Titulo ||

    "";

    document.getElementById(

        "subtitulo"

    ).textContent =

    config.Subtitulo ||

    "";

        document.getElementById(
        "titulo"
    ).textContent =
    config.Titulo || "";

    document.getElementById(
        "subtitulo"
    ).textContent =
    config.Subtitulo || "";

    // -------------------------
    // IMAGEM PRINCIPAL
    // -------------------------

    if(config.Imagem_Principal){

        document.getElementById(
            "imagemPrincipal"
        ).innerHTML =

        "<img src='" +

        config.Imagem_Principal +

        "' style='width:100%;border-radius:12px;margin-bottom:25px;'>";

    }

    // -------------------------
    // MENSAGENS GERAIS
    // -------------------------

    let html = "";

    Object.keys(config)

    .filter(chave=>

        chave.startsWith(

            "Mensagem_Geral"

        )

    )

    .sort()

    .forEach(chave=>{

        if(config[chave]){

            html +=

            "<div class='mensagem card-azul'>" +

            config[chave] +

            "</div>";

        }

    });

    document.getElementById(

        "mensagemGeral"

    ).innerHTML = html;

    // -------------------------
    // LIVRETO
    // -------------------------

    const botaoLivreto =

        document.getElementById(

            "botaoLivreto"

        );

    if(config.Livreto){

        botaoLivreto.href =

        config.Livreto;

    }

    else{

        botaoLivreto.style.display =

        "none";

    }

}

</script>

</body>

</html>
