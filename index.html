<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#003b6f"
    >

    <title>Medalha Mérito Santos-Dumont</title>

    <link
        rel="stylesheet"
        href="css/portal.css"
    >
</head>

<body>

    <main class="container pagina-inicial">

        <!-- Banner temporário de teste -->
        <section class="banner" id="secao-banner">

            <img
                id="imagem-capa"
                src="https://picsum.photos/1400/500"
                alt="Imagem da solenidade"
            >

        </section>


        <!-- Informações principais -->
        <section class="card card-principal">

            <header class="cabecalho-solenidade">

                <h1 id="titulo-solenidade">
                    Medalha Mérito Santos-Dumont
                </h1>

                <p
                    id="data-solenidade"
                    class="informacao-solenidade"
                >
                    14 de julho de 2026
                </p>

                <p
                    id="local-solenidade"
                    class="informacao-solenidade"
                >
                    Pátio de Solenidades da Base Aérea de Brasília
                </p>

            </header>


            <nav
                class="acoes-principais"
                aria-label="Opções da solenidade"
            >

                <a
                    class="botao botao-principal"
                    href="presenca.html"
                >

                    <span class="titulo">
                        REGISTRAR PRESENÇA
                    </span>

                    <span class="subtitulo">
                        Confira sua posição no dispositivo
                    </span>

                </a>


                <!-- Temporário. Será ocultado quando não houver link na planilha. -->
                <a
                    class="botao botao-secundario"
                    id="botao-livreto"
                    href="#"
                >

                    <span class="titulo">
                        Programa Oficial
                    </span>

                    <span class="subtitulo">
                        Consulte as informações da solenidade
                    </span>

                </a>

            </nav>

        </section>


        <!-- Temporário. Será ocultado quando não houver patrocinadores. -->
        <section
            class="patrocinadores"
            id="secao-patrocinadores"
        >

            <h2 id="titulo-patrocinadores">
                APOIO
            </h2>

            <div class="logos">

                <img
                    src="https://dummyimage.com/220x70/ffffff/888888&text=LOGO+1"
                    alt="Patrocinador 1"
                >

                <img
                    src="https://dummyimage.com/220x70/ffffff/888888&text=LOGO+2"
                    alt="Patrocinador 2"
                >

                <img
                    src="https://dummyimage.com/220x70/ffffff/888888&text=LOGO+3"
                    alt="Patrocinador 3"
                >

            </div>

        </section>

    </main>

</body>

</html>
